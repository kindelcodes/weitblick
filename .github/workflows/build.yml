# Baut Weitblick für Windows und Linux.
# - Bei jedem Push auf main und von Hand (Actions → Build → Run workflow): Pakete als Artefakte.
# - Bei einem Tag v* (z. B. v0.1.0): zusätzlich ein Release-Entwurf mit allen Paketen.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri-CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Bauen und Release-Entwurf anlegen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Weitblick ${{ github.ref_name }}
          releaseBody: Installationspakete für Windows (.msi, setup.exe) und Linux (.AppImage, .deb, .rpm).
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: weitblick-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
