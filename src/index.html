<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Weitblick</title>
    <script>
      window.addEventListener("error", (e) => {
        const p = document.createElement("pre");
        p.style.cssText = "position:fixed;z-index:999;top:0;left:0;background:#fff;color:#c00;padding:8px";
        p.textContent = `${e.message} @ ${e.filename}:${e.lineno}`;
        document.documentElement.append(p);
      });
    </script>
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">Weitblick</span>
      <span class="doc-title" id="doc-title"></span>
      <div class="tools">
        <button id="btn-open" title="Öffnen (Strg+O)">Öffnen</button>
        <button id="btn-save" title="Speichern (Strg+S, unter neuem Namen: Strg+Umschalt+S)">Speichern</button>
        <button id="btn-undo" title="Rückgängig (Strg+Z)">↶</button>
        <button id="btn-redo" title="Wiederholen (Strg+Y)">↷</button>
        <span class="sep"></span>
        <button id="btn-add-image" title="Bild einfügen (oder Datei auf die Leinwand ziehen)">▣ Bild</button>
        <button id="btn-add-text" title="Text hinzufügen">T Text</button>
        <button id="btn-add-frame" title="Rahmen hinzufügen (kommt in den Pfad)">▭ Rahmen</button>
        <button id="btn-add-rect" title="Rechteck hinzufügen">■ Rechteck</button>
        <button id="btn-add-ellipse" title="Kreis hinzufügen">● Kreis</button>
        <span class="sep"></span>
        <button id="btn-text-smaller" data-needs="text" title="Schrift kleiner">A−</button>
        <button id="btn-text-bigger" data-needs="text" title="Schrift größer">A+</button>
        <button id="btn-add-to-path" data-needs="any" title="Ausgewähltes Objekt als Schritt an den Pfad anhängen">+ Pfad</button>
        <button id="btn-delete" data-needs="any" title="Löschen (Entf)">Löschen</button>
        <span class="sep"></span>
        <button id="btn-present" class="primary" title="Präsentieren (F5, ab aktuellem Schritt: Umschalt+F5)">▶ Präsentieren</button>
      </div>
    </header>

    <aside class="pathbar">
      <div class="pathbar-head">Pfad</div>
      <ol id="path-list"></ol>
    </aside>

    <main id="viewport" class="viewport">
      <div id="world" class="world"></div>
      <div id="formatbar" class="formatbar">
        <label class="color" title="Farbe"><input type="color" id="inp-color" data-needs="color" /></label>
        <span class="sep"></span>
        <select id="sel-font" data-needs="text" title="Schriftart">
          <option value="sans">Serifenlos</option>
          <option value="serif">Serif</option>
          <option value="mono">Schreibmaschine</option>
        </select>
        <button id="btn-bold" data-needs="text" title="Fett (Strg+B)"><b>B</b></button>
        <button id="btn-italic" data-needs="text" title="Kursiv (Strg+I)"><i>I</i></button>
        <button id="btn-align" data-needs="text" title="Ausrichtung wechseln">⇤</button>
        <span class="sep"></span>
        <button id="btn-fade-in" data-needs="any" title="Animationsschritt: beim Präsentieren einblenden (nach dem aktuellen Schritt)">✦ Einblenden</button>
        <button id="btn-fade-out" data-needs="any" title="Animationsschritt: beim Präsentieren ausblenden (nach dem aktuellen Schritt)">✧ Ausblenden</button>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>
      <div class="present-controls">
        <button id="pc-prev" title="Zurück (←)">‹</button>
        <span id="step-label"></span>
        <button id="pc-next" title="Weiter (→)">›</button>
        <button id="pc-home" title="Überblick (Pos1)">⌂</button>
        <button id="pc-exit" title="Beenden (Esc)">✕</button>
      </div>
    </main>

    <nav class="navbar">
      <button id="btn-prev" title="Zurück (←)">‹</button>
      <button id="btn-next" title="Weiter (→)">›</button>
      <span class="sep"></span>
      <button id="btn-home" title="Überblick (Pos1)">⌂</button>
      <span class="sep"></span>
      <button id="btn-zoom-out" title="Herauszoomen">−</button>
      <span id="zoom-label" class="zoom-label">100 %</span>
      <button id="btn-zoom-in" title="Hineinzoomen">+</button>
    </nav>
  </body>
</html>
